<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKRT Transport | Horizontal Journey</title>
    <meta name="description" content="A horizontal transport landing page with a cinematic layout, warm gradient backdrop, and scroll-driven section movement.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Barlow+Condensed:wght@500;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="stage">
        <div class="stage-star" aria-hidden="true"></div>

        <div class="poster-shell">
            <div class="poster">
                <div class="poster-noise" aria-hidden="true"></div>
                <div class="poster-orbit orbit-left" aria-hidden="true"></div>
                <div class="poster-orbit orbit-right" aria-hidden="true"></div>

                <div class="poster-scene">
                    <div class="poster-track">
                        <section id="home" class="poster-section home-section">
                            <span class="section-label">HOME</span>
                            <div class="lane-grid home-grid">
                                <article class="panel hero-panel left-lane">
                                    <p class="hero-title"></p>
                                </article>

                                <div class="right-lane home-side">
                                    <article class="panel quote-panel">
                                        <p></p>
                                    </article>
                                    <article class="panel empty-panel"></article>
                                </div>
                            </div>
                        </section>

                        <section id="about" class="poster-section about-section">
                            <span class="section-label">ABOUT</span>
                            <div class="about-decor" aria-hidden="true">
                                <img src="ellipse-409-wide.svg" alt="" class="about-ellipse about-ellipse-left">
                                <img src="ellipse-409-wide.svg" alt="" class="about-ellipse about-ellipse-right">
                            </div>
                            <div class="lane-grid about-grid">
                                <div class="left-lane story-column">
                                    <article class="story-block">
                                        <h2><br></h2>
                                        <p></p>
                                    </article>
                                    <article class="story-block">
                                        <h2><br></h2>
                                        <p></p>
                                    </article>
                                </div>

                                <div class="right-lane story-column">
                                    <article class="story-block">
                                        <h2><br></h2>
                                        <p></p>
                                    </article>
                                    <article class="story-block">
                                        <h2><br></h2>
                                        <p></p>
                                    </article>
                                </div>
                            </div>
                        </section>

                        <section id="services" class="poster-section services-section">
                            <span class="section-label">SERVICES</span>
                            <div class="services-board">
                                <article class="panel service-panel">
                                    <h2></h2>
                                    <p></p>
                                </article>
                                <article class="panel service-panel">
                                    <h2></h2>
                                    <p></p>
                                </article>
                                <article class="panel service-panel service-panel-ghost"></article>
                                <article class="panel service-panel">
                                    <h2></h2>
                                    <p></p>
                                </article>
                                <article class="panel service-panel service-panel-ghost"></article>
                                <article class="panel service-panel">
                                    <h2></h2>
                                    <p></p>
                                </article>
                            </div>
                        </section>

                        <section id="tracking" class="poster-section tracking-section">
                            <span class="section-label">TRACKING</span>
                        </section>

                        <section id="contact" class="poster-section contact-section">
                            <span class="section-label">CONTACTS</span>
                            <div class="lane-grid">
                                <aside class="left-lane contact-copy">
                                    <div class="copy-stack">
                                        <p class="eyebrow">Contact.</p>
                                        <p class="detail-text">+91 22222 44444</p>
                                        <p class="micro-text">Available 24/7 for routing, scheduling, and shipment support.</p>
                                    </div>
                                    <div class="copy-stack">
                                        <p class="eyebrow">Email.</p>
                                        <p class="detail-text">skrttransport@gmail.com</p>
                                    </div>
                                </aside>

                                <article class="panel panel-form right-lane">
                                    <form id="logistics-form">
                                        <label>
                                            <span>Name</span>
                                            <input type="text" name="name" autocomplete="off" required>
                                        </label>
                                        <label>
                                            <span>Email</span>
                                            <input type="email" name="email" autocomplete="off" required>
                                        </label>
                                        <label>
                                            <span>Contact No</span>
                                            <input type="tel" name="phone" autocomplete="off" required>
                                        </label>
                                        <label>
                                            <span>Message</span>
                                            <textarea name="message" rows="4" autocomplete="off" required></textarea>
                                        </label>
                                        <button type="submit" class="pill-button">Submit</button>
                                    </form>
                                </article>
                            </div>
                        </section>
                    </div>
                </div>

                <div class="home-truck-layer" aria-hidden="true">
                    <div class="truck-scene truck-scene-forward">
                        <div class="truck-light truck-light-head" aria-hidden="true">
                            <img src="/HeadLight-polygon.svg" alt="">
                        </div>
                        <div class="truck-light truck-light-rear" aria-hidden="true">
                            <img src="/rear-light.svg" alt="">
                        </div>
                        <div class="truck-wheel truck-wheel-rear"></div>
                        <div class="truck-wheel truck-wheel-middle"></div>
                        <div class="truck-wheel truck-wheel-front"></div>
                        <model-viewer
                            class="home-truck"
                            src="/truck-model.glb"
                            alt="Cargo truck"
                            camera-orbit="180deg 82deg 185%"
                            field-of-view="20deg"
                            exposure="1.08"
                            shadow-intensity="0"
                            environment-image="neutral"
                            disable-pan
                            disable-zoom
                            disable-tap
                            interaction-prompt="none"
                            loading="eager"
                        ></model-viewer>
                    </div>
                    <div class="truck-scene truck-scene-reverse">
                        <div class="truck-light truck-light-head" aria-hidden="true">
                            <img src="/HeadLight-polygon.svg" alt="">
                        </div>
                        <div class="truck-light truck-light-rear" aria-hidden="true">
                            <img src="/rear-light.svg" alt="">
                        </div>
                        <div class="truck-wheel truck-wheel-rear"></div>
                        <div class="truck-wheel truck-wheel-middle"></div>
                        <div class="truck-wheel truck-wheel-front"></div>
                        <model-viewer
                            class="home-truck"
                            src="/truck-model.glb"
                            alt="Cargo truck facing the opposite direction"
                            camera-orbit="0deg 82deg 185%"
                            field-of-view="20deg"
                            exposure="1.08"
                            shadow-intensity="0"
                            environment-image="neutral"
                            disable-pan
                            disable-zoom
                            disable-tap
                            interaction-prompt="none"
                            loading="eager"
                        ></model-viewer>
                    </div>
                </div>

                <nav class="dock" aria-label="Section navigation">
                    <a href="#home" class="dock-logo" aria-label="SKRT Transport home">
                        <img src="public/logo-Main.png" alt="SKRT Transport logo">
                    </a>
                    <button class="dock-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="dock-menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="dock-track" id="dock-menu">
                        <a href="#home" class="dock-link" data-target="home">HOME</a>
                        <a href="#about" class="dock-link" data-target="about">ABOUT</a>
                        <a href="#services" class="dock-link" data-target="services">SERVICES</a>
                        <a href="#tracking" class="dock-link dock-link-muted" data-target="tracking">TRACKING</a>
                        <a href="#contact" class="dock-link" data-target="contact">CONTACT</a>
                        
                    </div>
                </nav>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
